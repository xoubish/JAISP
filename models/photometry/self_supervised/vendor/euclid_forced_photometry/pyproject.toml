[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euclid_phot"
version = "0.5.0"
description = "Educational workflows for Euclid Q1 VIS/NISP and unWISE forced photometry with Tractor."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Nima Chartab", email = "n.chartab@ipac.caltech.edu" },
]
keywords = ["astronomy", "photometry", "euclid", "tractor", "forced-photometry", "irsa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=5.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "sep>=1.2",
    "reproject>=0.13",
    "pyvo>=1.5",
    "astroquery>=0.4.7",
    "s3fs>=2024.6",
    "fsspec[http]>=2024.6",
    # Tractor and astrometry.net are installed from GitHub (see README);
    # the PyPI packages with those names are unrelated projects.
    # unwise_psf + fitsio (WISE leg) are likewise manual and optional.
]

[project.scripts]
euclid-phot = "euclid_phot.cli:main"

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
]

[project.urls]
Homepage = "https://github.com/NimaChartab/euclid-forced-photometry"
Documentation = "https://github.com/NimaChartab/euclid-forced-photometry#readme"
Issues = "https://github.com/NimaChartab/euclid-forced-photometry/issues"

[tool.setuptools.packages.find]
where = ["src"]
